<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | AK × ST</title>
<style>

:root{--bg:#05070b;--panel:#0b1018;--panel2:#0f1622;--text:#f6f8fb;--muted:#98a6b8;--line:#1c2838;--accent:#68a7ff;--accent2:#79f0c1;--max:1180px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 0,#10233d 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),calc(100% - 40px));margin:auto}
nav{position:fixed;z-index:50;top:0;left:0;right:0;background:rgba(5,7,11,.72);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:-.03em}.brand span{color:var(--accent)}
.links{display:flex;gap:25px;color:#b8c4d2;font-size:13px}.links a:hover{color:#fff}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #29405c;border-radius:999px;padding:12px 18px;background:#0c1521;font-weight:800;font-size:13px}.btn.primary{background:#fff;color:#05070b;border-color:#fff}
.hero{min-height:100svh;display:flex;align-items:center;padding:120px 0 70px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:520px;height:520px;border:1px solid #17304e;border-radius:50%;right:-180px;top:20%;box-shadow:0 0 100px rgba(80,150,255,.12)}

.hero h1 em{font-style:normal;color:#8aa8c8}.hero p{max-width:720px;color:#aab6c5;font-size:clamp(17px,2vw,22px);line-height:1.55}.actions{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.marquee{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;color:#8fa0b4;font-size:12px;font-weight:900;letter-spacing:.12em;overflow:hidden}.marquee div{white-space:nowrap}
section{padding:105px 0}.section-head{display:grid;grid-template-columns:.55fr 1.45fr;gap:30px;margin-bottom:45px}.num{color:#607087;font-size:12px;font-weight:900;letter-spacing:.15em}.section-head h2{font-size:clamp(38px,5vw,70px);line-height:.98;letter-spacing:-.055em;margin:0}.section-head p{color:var(--muted);max-width:650px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:linear-gradient(145deg,#0c121b,#080c12);border:1px solid var(--line);border-radius:20px;padding:25px;min-height:210px}.card small{color:var(--accent);font-weight:900;letter-spacing:.1em}.card h3{font-size:22px;margin:35px 0 10px}.card p{color:var(--muted);line-height:1.6;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:22px;overflow:hidden}.stat{padding:30px;border-right:1px solid var(--line);background:#080d14}.stat:last-child{border:0}.stat b{display:block;font-size:38px;letter-spacing:-.05em}.stat span{display:block;color:#8393a6;font-size:12px;line-height:1.5;margin-top:8px}
.cases{display:grid;gap:14px}.case{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px;padding:32px;border:1px solid var(--line);border-radius:22px;background:#080d14}.case .tag{color:var(--accent2);font-size:11px;font-weight:900;letter-spacing:.12em}.case h3{font-size:32px;margin:10px 0}.case p{color:var(--muted);line-height:1.65}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.chip{font-size:10px;border:1px solid #26374c;border-radius:999px;padding:7px 10px;color:#b4c0ce}
.result{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}.result div{padding:22px;border-radius:16px;background:#0e1621;border:1px solid #1c2c40}.result b{display:block;font-size:30px}.result small{color:#91a1b4;line-height:1.5}
.websites{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.site{padding:25px;border:1px solid var(--line);border-radius:18px;background:#090e15;display:flex;justify-content:space-between;align-items:center}.site b{font-size:18px}.site span{color:var(--accent)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:14px}.person{padding:32px;border:1px solid var(--line);border-radius:22px;background:#090e15}.person h3{font-size:32px;margin:8px 0}.person .role{color:var(--accent2);font-weight:800}.person p{color:var(--muted);line-height:1.7}
.cta{padding:60px;border:1px solid #24415f;border-radius:28px;background:radial-gradient(circle at 90% 20%,#14365d,transparent 35%),#09111b}.cta h2{font-size:clamp(42px,6vw,80px);line-height:.95;letter-spacing:-.06em;margin:0 0 20px}.cta p{color:#aebdcb;max-width:650px;line-height:1.6}
footer{padding:30px 0 50px;color:#65758a;font-size:12px}
.note{margin-top:16px;color:#65758a;font-size:11px;line-height:1.6}
.reveal{opacity:0;transform:translateY(22px);transition:.7s ease}.reveal.show{opacity:1;transform:none}
@media(max-width:800px){.links{display:none}.wrap{width:min(100% - 28px,var(--max))}.hero h1{font-size:clamp(49px,15vw,72px)}section{padding:75px 0}.section-head,.case{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat{border-bottom:1px solid var(--line)}.websites,.people{grid-template-columns:1fr}.result{margin-top:10px}.cta{padding:32px 24px}}

/* ===== PORTFOLIO ASSISTANT ===== */
.portfolio-assistant{position:fixed;z-index:100;right:24px;bottom:24px;width:min(360px,calc(100vw - 28px));padding:22px;border:1px solid #2a425e;border-radius:24px;background:rgba(7,12,19,.96);box-shadow:0 25px 80px rgba(0,0,0,.55),0 0 50px rgba(65,140,255,.10);backdrop-filter:blur(20px);transform:translateY(18px) scale(.97);opacity:0;pointer-events:none;transition:.28s ease}
.portfolio-assistant.open{transform:none;opacity:1;pointer-events:auto}
.pa-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;opacity:0;pointer-events:none;transition:.25s}
.pa-backdrop.open{opacity:1;pointer-events:auto}
.pa-close{position:absolute;right:12px;top:10px;border:0;background:none;color:#91a1b4;font-size:25px;cursor:pointer}
.pa-orb{width:52px;height:52px;border:1px solid #31577f;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#1b3a5d,#07101a 68%);box-shadow:0 0 28px rgba(90,160,255,.18)}
.pa-orb span{width:15px;height:15px;border-radius:50%;background:#79f0c1;box-shadow:0 0 18px #79f0c1}
.pa-name{margin-top:13px;font-size:10px;letter-spacing:.18em;font-weight:900;color:#a8c7e8}
.pa-status{display:flex;align-items:center;gap:7px;margin-top:5px;color:#6f8195;font-size:11px}
.pa-status i{width:6px;height:6px;border-radius:50%;background:#79f0c1;box-shadow:0 0 9px #79f0c1}
.pa-message{margin:17px 0;padding:14px;border:1px solid #1b2a3b;border-radius:14px;background:#0b131d;color:#b8c5d3;font-size:13px;line-height:1.55}
.pa-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pa-action{border:1px solid #24384f;background:#0c1520;color:#dce6f0;border-radius:11px;padding:10px 8px;font-size:11px;font-weight:800;cursor:pointer}
.pa-action.quote{grid-column:1/-1;border-color:#536d4d;background:#101b15;color:#d9f3e6}
.pa-input-row{display:flex;gap:7px;margin-top:10px}
.pa-input-row input{min-width:0;flex:1;border:1px solid #24384f;border-radius:11px;background:#080e16;color:#fff;padding:11px 12px;outline:none;font-size:12px}
.pa-input-row button{width:42px;border:0;border-radius:11px;background:#fff;color:#05070b;font-weight:900;cursor:pointer}
.pa-mic{width:100%;margin-top:8px;border:1px solid #203449;background:#0a121c;color:#9db0c4;border-radius:11px;padding:9px;font-size:11px;cursor:pointer}
.pa-mic.listening{border-color:#79f0c1;color:#dffbef}
.pa-launch{position:fixed;right:24px;bottom:24px;z-index:80;border:1px solid #2d4966;border-radius:999px;background:rgba(7,12,19,.94);color:#eaf1f8;padding:12px 17px;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:900;box-shadow:0 12px 40px rgba(0,0,0,.35);cursor:pointer;backdrop-filter:blur(15px)}
.pa-launch-dot{width:8px;height:8px;border-radius:50%;background:#79f0c1;box-shadow:0 0 12px #79f0c1}
@media(max-width:600px){.portfolio-assistant{right:14px;bottom:14px;width:calc(100vw - 28px);padding:18px}.pa-launch{right:14px;bottom:14px}}


/* ===== CONTACT SUPPORT ===== */
.contact-overlay{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.62);backdrop-filter:blur(10px);opacity:0;visibility:hidden;pointer-events:none;transition:.22s ease}
.contact-overlay.open{opacity:1;visibility:visible;pointer-events:auto}
.contact-modal{position:relative;width:min(470px,100%);padding:30px;border:1px solid #2b425c;border-radius:25px;background:#080e16;box-shadow:0 30px 100px rgba(0,0,0,.65);transform:translateY(15px) scale(.98);transition:.22s ease}
.contact-overlay.open .contact-modal{transform:none}

.contact-option:hover{border-color:#557da7;transform:translateY(-1px)}

.contact-option b{display:block;font-size:13px;color:#eef4fa}
.contact-option small{display:block;margin-top:3px;color:#8193a8;font-size:11px}

@media(max-width:600px){.contact-modal{padding:24px 18px;border-radius:20px}.contact-modal h3{font-size:26px}.contact-option{grid-template-columns:40px 1fr 24px}.contact-icon{width:38px;height:38px}}


/* ===== CINEMATIC DEPTH + TOUCH FINAL ===== */
body{background:#030509!important;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(67,131,213,.16),transparent 28%),linear-gradient(#030509,#050912)}
body:after{content:"";position:fixed;left:-35%;right:-35%;bottom:-48%;height:105%;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(111,173,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(111,173,255,.09) 1px,transparent 1px);background-size:70px 70px;transform:perspective(700px) rotateX(67deg);transform-origin:center bottom;mask-image:linear-gradient(to top,#000,transparent 88%)}

.card:after,.case:after,.site:after,.person:after,.stat:after,.cta:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--cx,50%) var(--cy,50%),rgba(112,173,255,.20),transparent 34%);opacity:0;transition:opacity .18s}
.card:hover:after,.case:hover:after,.site:hover:after,.person:hover:after,.stat:hover:after,.cta:hover:after{opacity:1}
.card:hover,.case:hover,.site:hover,.person:hover,.stat:hover,.cta:hover{border-color:rgba(112,173,255,.46)!important;box-shadow:0 28px 70px rgba(0,0,0,.42),0 0 28px rgba(80,150,255,.08)!important}
.touch-down{transform:scale(.975)!important}
.depth-progress{position:fixed;right:7px;top:78px;bottom:78px;width:1px;background:rgba(255,255,255,.08);z-index:45}.depth-progress i{display:block;width:1px;height:0;background:#70adff;box-shadow:0 0 8px #70adff}
@media(max-width:800px){.depth-progress{display:none}.card,.case,.site,.person,.stat,.cta{transition:transform .12s ease!important}}


/* ===== INDIVIDUAL PORTFOLIO UPGRADE ===== */
body{font-size:17px}.links,.btn{font-size:15px}.eyebrow{font-size:14px}.section-head p{font-size:18px}.card p,.person p,.case p{font-size:16px}.chip{font-size:12px}.person{cursor:pointer}.person h3{font-size:38px}.person:before{content:"VIEW PORTFOLIO ↗";position:absolute;right:24px;top:24px;font-size:11px;letter-spacing:.12em;color:#79f0c1;font-weight:900}.portfolio-page{position:fixed;inset:0;z-index:300;background:radial-gradient(circle at 85% 10%,#102b4b,transparent 30%),#030509;overflow:auto;opacity:0;visibility:hidden;transform:scale(.985);transition:.3s ease}.portfolio-page.open{opacity:1;visibility:visible;transform:none}.portfolio-shell{width:min(1180px,calc(100% - 40px));margin:auto;padding:90px 0}.portfolio-back{position:fixed;top:24px;left:24px;z-index:320}.portfolio-hero{min-height:62vh;display:flex;align-items:center;position:relative}.portfolio-hero h1{font-size:clamp(58px,9vw,120px);line-height:.85;letter-spacing:-.075em;margin:16px 0}.portfolio-hero p{max-width:760px;color:#aab6c5;font-size:21px;line-height:1.6}.portfolio-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:34px}.portfolio-panel{padding:30px;border:1px solid #1c2838;border-radius:24px;background:linear-gradient(145deg,#0d1520,#070b11);transform-style:preserve-3d;transition:.2s}.portfolio-panel:hover{transform:perspective(900px) rotateX(2deg) rotateY(-2deg) translateY(-4px);border-color:#456c98;box-shadow:0 30px 80px rgba(0,0,0,.45)}.portfolio-panel h2{font-size:30px;margin:6px 0 16px}.portfolio-panel h3{font-size:21px;margin:20px 0 7px}.portfolio-panel p,.portfolio-panel li{color:#9eacbd;line-height:1.7}.portfolio-panel ul{padding-left:20px}.skill-cloud{display:flex;gap:9px;flex-wrap:wrap}.skill-cloud span{padding:10px 13px;border:1px solid #29405c;border-radius:999px;background:#0c1521;font-weight:800;font-size:13px}.metric-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}.metric-strip div{padding:20px;border:1px solid #1c2c40;border-radius:18px;background:#0b121c}.metric-strip b{display:block;font-size:25px}.metric-strip small{color:#8393a6}.portfolio-placeholder{min-height:70vh;display:grid;place-items:center;text-align:center}.portfolio-placeholder h1{font-size:clamp(48px,8vw,100px);margin:0}.portfolio-placeholder p{color:#98a6b8;font-size:19px}.work-cta{box-shadow:0 0 0 0 rgba(121,240,193,.25);transition:.2s}.work-cta:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 12px 40px rgba(121,240,193,.14);border-color:#79f0c1}.team-hint{display:block;margin-top:14px;color:#79f0c1;font-size:12px;font-weight:900;letter-spacing:.1em}@media(max-width:800px){body{font-size:16px}.portfolio-grid,.metric-strip{grid-template-columns:1fr}.portfolio-shell{width:calc(100% - 28px);padding-top:80px}.portfolio-hero p{font-size:18px}.person:before{position:static;display:block;margin-bottom:10px}}

/* ===== RELIABLE TEAM PORTFOLIO INTERACTION ===== */
.person[data-portfolio]{position:relative;cursor:pointer;touch-action:manipulation;user-select:none;will-change:transform,box-shadow;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;background:linear-gradient(145deg,#0b121b,#070b11)}

/* ===== USER REQUESTED VISUAL + INTERACTION PASS ===== */
